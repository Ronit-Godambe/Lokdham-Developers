<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="preloader/preloader.js"></script>
    <title>Lokdham Developers | Project Manager</title>


    <style>
        /* =========================================
           RESET
        ========================================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        :root {
            --navy: #1d2f4d;
            --navy-light: #273d61;
            --gold: #b18428;
            --gold-dark: #987021;
            --bg: #f3f5f8;
            --white: #ffffff;
            --text: #1d2f4d;
            --muted: #7b8594;
            --border: #e4e8ee;
        }


        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background:
                radial-gradient(circle at top left,
                    rgba(177, 132, 40, 0.10),
                    transparent 35%),
                var(--bg);
            color: var(--text);
        }


        button,
        select,
        input {
            font-family: inherit;
        }


        button {
            -webkit-tap-highlight-color: transparent;
        }



        /* =========================================
           LOGIN
        ========================================= */

        .login-screen {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
        }


        .login-card {
            width: 100%;
            max-width: 440px;
            background: rgba(255, 255, 255, 0.97);
            padding: 42px;
            border-radius: 22px;
            border: 1px solid rgba(29, 47, 77, 0.08);
            box-shadow:
                0 25px 70px rgba(29, 47, 77, 0.12);
        }


        .login-logo {
            width: 88px;
            height: 88px;
            margin: 0 auto 22px;
            background: #ffffff;
            border: 1px solid #e5e8ed;
            border-radius: 14px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow:
                0 8px 25px rgba(29, 47, 77, 0.10);
        }


        .login-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }


        .login-card h1 {
            text-align: center;
            font-size: 30px;
            color: var(--navy);
            margin-bottom: 8px;
        }


        .login-card>p {
            text-align: center;
            color: var(--muted);
            font-size: 15px;
            margin-bottom: 30px;
        }


        .login-card hr {
            border: none;
            height: 1px;
            background: #e8ebef;
            margin-bottom: 28px;
        }


        .login-card label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 700;
            color: #34445e;
        }


        .login-card input {
            width: 100%;
            height: 52px;
            padding: 0 15px;
            margin-bottom: 20px;
            border: 1px solid #d9dee6;
            border-radius: 10px;
            background: #ffffff;
            font-size: 15px;
            outline: none;
        }


        .login-card input:focus {
            border-color: var(--gold);
            box-shadow:
                0 0 0 4px rgba(177, 132, 40, 0.12);
        }


        .login-btn {
            width: 100%;
            height: 54px;
            border: none;
            border-radius: 10px;
            background: var(--navy);
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s ease;
        }


        .login-btn:hover {
            background: var(--navy-light);
            transform: translateY(-1px);
        }


        #loginMessage {
            min-height: 20px;
            margin-top: 16px;
            text-align: center;
            color: #c0392b;
            font-size: 14px;
        }



        /* =========================================
           COMMON FIXED NAVBAR
        ========================================= */

        .top-navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 76px;
            z-index: 9999;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 32px;

            background:
                rgba(29, 47, 77, 0.98);

            box-shadow:
                0 4px 20px rgba(0, 0, 0, 0.12);
        }


        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 14px;
            min-width: 0;
        }


        .navbar-logo {
            width: 48px;
            height: 48px;
            flex-shrink: 0;

            background: white;
            border-radius: 9px;
            padding: 4px;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;
        }


        .navbar-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }


        .navbar-text {
            min-width: 0;
        }


        .navbar-text span {
            display: block;
            color: rgba(255, 255, 255, 0.65);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 3px;
        }


        .navbar-text strong {
            display: block;
            color: white;
            font-size: 17px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }


        .navbar-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }


        .back-btn,
        .logout-btn {
            height: 42px;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            border-radius: 9px;

            padding: 0 17px;

            font-size: 14px;
            font-weight: 700;

            cursor: pointer;

            white-space: nowrap;
        }


        .back-btn {
            border: 1px solid rgba(255, 255, 255, 0.25);
            background: transparent;
            color: white;
        }


        .back-btn:hover {
            background: rgba(255, 255, 255, 0.10);
        }


        .logout-btn {
            border: 1px solid rgba(255, 255, 255, 0.25);
            background: white;
            color: var(--navy);

            min-width: 92px;
        }


        .logout-btn:hover {
            background: #f1f3f6;
        }



        /* =========================================
           MAIN APP
        ========================================= */

        .app-screen {
            display: none;
            min-height: 100vh;
        }


        .app-content {
            width: 100%;
            max-width: 1150px;
            margin: 0 auto;
            padding:
                116px 25px 60px;
        }


        .page-header {
            margin-bottom: 32px;
        }


        .page-header h1 {
            font-size: 32px;
            color: var(--navy);
            margin-bottom: 8px;
        }


        .page-header p {
            color: var(--muted);
            font-size: 15px;
        }



        /* =========================================
           PROJECTS
        ========================================= */

        .projects-grid {
            display: grid;
            grid-template-columns:
                repeat(3, minmax(0, 1fr));
            gap: 20px;
        }


        .project-card {
            width: 100%;
            text-align: left;

            border: 1px solid var(--border);
            background: white;

            padding: 28px;
            border-radius: 18px;

            cursor: pointer;

            box-shadow:
                0 8px 25px rgba(29, 47, 77, 0.05);

            transition: 0.2s ease;
        }


        .project-card:hover {
            transform: translateY(-3px);
            box-shadow:
                0 15px 35px rgba(29, 47, 77, 0.10);
            border-color:
                rgba(177, 132, 40, 0.40);
        }



        .project-card h2 {
            color: var(--navy);
            font-size: 22px;
            margin-bottom: 8px;
        }


        .project-card p {
            color: var(--muted);
            font-size: 14px;
            line-height: 1.6;
        }


        .project-card-footer {
            margin-top: 24px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            color: var(--gold);
            font-size: 14px;
            font-weight: 700;
        }



        /* =========================================
           PROJECT PAGE
        ========================================= */

        #keladGreensPage {
            display: none;
        }


        .project-page-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 20px;

            margin-bottom: 28px;
        }


        .project-page-header h1 {
            font-size: 32px;
            color: var(--navy);
            margin-bottom: 8px;
        }


        .project-page-header p {
            color: var(--muted);
            font-size: 15px;
        }



        /* =========================================
           PLOTS
        ========================================= */

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: var(--muted);
            font-size: 17px;
        }


        .plot-grid {
            display: grid;

            grid-template-columns:
                repeat(3, minmax(0, 1fr));

            gap: 20px;

            /*
             Extra bottom space ensures Plot 14
             never goes behind the fixed save bar.
            */
            padding-bottom: 120px;
        }


        .plot-card {
            background: white;
            border: 1px solid var(--border);

            padding: 22px;
            border-radius: 16px;

            box-shadow:
                0 8px 25px rgba(29, 47, 77, 0.05);

            transition: 0.2s ease;
        }


        .plot-card:hover {
            transform: translateY(-2px);
            box-shadow:
                0 14px 30px rgba(29, 47, 77, 0.09);
        }


        .plot-card-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
        }


        .plot-number {
            width: 52px;
            height: 52px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 14px;

            background: var(--navy);
            color: white;

            font-size: 17px;
            font-weight: 700;
        }


        .plot-details {
            margin-bottom: 20px;
        }


        .plot-details h3 {
            color: var(--gold);
            font-size: 22px;
            margin-bottom: 7px;
        }


        .plot-details p {
            color: var(--muted);
            font-size: 14px;
        }


        .plot-card select {
            width: 100%;
            height: 50px;

            padding: 0 14px;

            border: 1px solid #dce1e8;
            border-radius: 9px;

            background: white;
            color: var(--navy);

            font-size: 15px;
            cursor: pointer;
            outline: none;
        }


        .plot-card select:focus {
            border-color: var(--gold);
            box-shadow:
                0 0 0 3px rgba(177, 132, 40, 0.10);
        }



        /* =========================================
           FIXED SAVE BAR
        ========================================= */

        .save-bar {
            position: fixed;

            left: 0;
            right: 0;
            bottom: 0;

            z-index: 9998;

            display: none;

            background:
                rgba(255, 255, 255, 0.96);

            border-top:
                1px solid #e1e5eb;

            box-shadow:
                0 -8px 25px rgba(29, 47, 77, 0.08);

            padding: 14px 25px;
        }


        .save-bar-inner {
            width: 100%;
            max-width: 1150px;
            margin: 0 auto;

            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }


        .save-info {
            color: var(--muted);
            font-size: 14px;
        }


        .save-all-btn {
            min-width: 190px;
            height: 50px;

            border: none;
            border-radius: 10px;

            background: var(--gold);
            color: white;

            font-size: 15px;
            font-weight: 700;

            cursor: pointer;

            transition: 0.2s ease;
        }


        .save-all-btn:hover {
            background: var(--gold-dark);
            transform: translateY(-1px);
        }


        .save-all-btn:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
        }



        /* =========================================
           MESSAGE
        ========================================= */

        .message {
            position: fixed;
            right: 25px;
            bottom: 85px;

            z-index: 10000;

            display: none;

            padding: 15px 22px;

            background: var(--navy);
            color: white;

            border-radius: 10px;

            font-size: 14px;

            box-shadow:
                0 12px 30px rgba(29, 47, 77, 0.20);
        }



        /* =========================================
           TABLET
        ========================================= */

        @media (max-width: 900px) {

            .projects-grid {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));
            }


            .plot-grid {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));
            }

        }



        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 650px) {

            .login-screen {
                padding: 20px 15px;
            }


            .login-card {
                padding: 32px 22px;
                border-radius: 18px;
            }


            .login-logo {
                width: 78px;
                height: 78px;
            }


            .login-card h1 {
                font-size: 26px;
            }


            .top-navbar {
                height: 68px;
                padding: 0 14px;
                gap: 10px;
            }


            .navbar-brand {
                gap: 9px;
                flex: 1;
                overflow: hidden;
            }


            .navbar-logo {
                width: 40px;
                height: 40px;
                border-radius: 8px;
            }


            .navbar-text span {
                font-size: 9px;
            }


            .navbar-text strong {
                font-size: 13px;
            }


            .navbar-actions {
                gap: 6px;
            }


            .back-btn,
            .logout-btn {
                height: 38px;
                padding: 0 11px;
                font-size: 12px;
                min-width: auto;
            }


            .app-content {
                padding:
                    96px 15px 130px;
            }


            .page-header {
                margin-bottom: 24px;
            }


            .page-header h1,
            .project-page-header h1 {
                font-size: 26px;
            }


            .projects-grid {
                grid-template-columns: 1fr;
                gap: 15px;
            }


            .project-card {
                padding: 23px;
            }


            .plot-grid {
                grid-template-columns: 1fr;
                gap: 15px;
                padding-bottom: 140px;
            }


            .plot-card {
                padding: 20px;
            }


            .save-bar {
                padding: 10px 14px;
            }


            .save-bar-inner {
                gap: 10px;
            }


            .save-info {
                display: none;
            }


            .save-all-btn {
                width: 100%;
                height: 52px;
                font-size: 15px;
            }


            .message {
                left: 15px;
                right: 15px;
                bottom: 78px;
                text-align: center;
            }

        }


        @media (max-width: 390px) {

            .navbar-text strong {
                font-size: 12px;
            }


            .navbar-text span {
                display: none;
            }


            .back-btn {
                padding: 0 9px;
                font-size: 11px;
            }


            .logout-btn {
                padding: 0 10px;
                font-size: 12px;
            }

        }
    </style>

</head>


<body>


    <div id="loginScreen" class="login-screen">

        <div class="login-card">

            <div class="login-logo">

                <img src="img/index/lokdhamtm.png" alt="Lokdham Developers">

            </div>


            <h1>
                Lokdham Developers
            </h1>


            <p>
                Project Manager Dashboard
            </p>


            <hr>


            <form id="loginForm">

                <label>Username or Email</label>

                <input type="text" id="loginInput" placeholder="Enter username or email" required>


                <label for="password">
                    Password
                </label>

                <input type="password" id="password" placeholder="Enter your password" required>


                <button type="submit" class="login-btn">
                    Login to Dashboard
                </button>

            </form>


            <div id="loginMessage"></div>

        </div>

    </div>

    <div id="appScreen" class="app-screen">

        <nav class="top-navbar">


            <div class="navbar-brand">

                <div class="navbar-logo">

                    <img src="img/index/lokdhamtm.png" alt="Lokdham Developers">

                </div>


                <div class="navbar-text">

                    <span>
                        LOKDHAM DEVELOPERS
                    </span>

                    <strong id="navbarTitle">
                        All Projects
                    </strong>

                </div>

            </div>


            <div class="navbar-actions">

                <button id="backBtn" class="back-btn" style="display: none;">
                    ← Projects
                </button>


                <button id="logoutBtn" class="logout-btn">
                    Logout
                </button>

            </div>

        </nav>



        <main class="app-content">

            <section id="projectsPage">

                <div class="page-header">

                    <h1>
                        All Projects
                    </h1>

                    <p>
                        Select a project to manage its availability and booking status.
                    </p>

                </div>


                <div id="projectsGrid" class="projects-grid">


                    <button class="project-card" data-project="kelad-greens">

                        <h2>
                            Kelad Greens
                        </h2>


                        <p>
                            Manage plot availability, bookings and sold-out status.
                        </p>


                        <div class="project-card-footer">

                            <span>
                                Manage Project
                            </span>

                            <span>
                                →
                            </span>

                        </div>

                    </button>


                    <!--
                    FUTURE PROJECT EXAMPLE

                    <button
                        class="project-card"
                        data-project="project-2"
                    >

                        <div class="project-card-icon">
                            P2
                        </div>

                        <h2>
                            Project 2
                        </h2>

                        <p>
                            Project description.
                        </p>

                        <div class="project-card-footer">

                            <span>
                                Manage Project
                            </span>

                            <span>
                                →
                            </span>

                        </div>

                    </button>
                    -->

                </div>

            </section>

            <section id="keladGreensPage">

                <div class="project-page-header">

                    <div>

                        <h1>
                            Kelad Greens
                        </h1>

                        <p>
                            Manage plot availability and booking status.
                        </p>

                    </div>

                </div>


                <div id="loading" class="loading">
                    Loading plots...
                </div>


                <div id="plotGrid" class="plot-grid">
                </div>

            </section>


        </main>

        <div id="saveBar" class="save-bar">

            <div class="save-bar-inner">

                <div class="save-info">
                    Review your changes and save them together.
                </div>


                <button id="saveAllBtn" class="save-all-btn">
                    Save All Changes
                </button>

            </div>

        </div>


    </div>

    <div id="message" class="message">
    </div>



    <script type="module">


        /* =====================================
           SUPABASE
        ====================================== */

        import { createClient }
            from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


        const supabaseUrl =
            "https://wmtxbkfbipntdaoeuetl.supabase.co";


        const supabaseKey =
            "sb_publishable_IMqCNjOib4YxKhM0RL93iA_b6IAEOF3";


        const supabase =
            createClient(
                supabaseUrl,
                supabaseKey
            );



        /* =====================================
           ELEMENTS
        ====================================== */

        const loginScreen =
            document.getElementById(
                "loginScreen"
            );


        const appScreen =
            document.getElementById(
                "appScreen"
            );


        const loginForm =
            document.getElementById(
                "loginForm"
            );


        const loginMessage =
            document.getElementById(
                "loginMessage"
            );


        const logoutBtn =
            document.getElementById(
                "logoutBtn"
            );


        const backBtn =
            document.getElementById(
                "backBtn"
            );


        const navbarTitle =
            document.getElementById(
                "navbarTitle"
            );


        const projectsPage =
            document.getElementById(
                "projectsPage"
            );


        const keladGreensPage =
            document.getElementById(
                "keladGreensPage"
            );


        const plotGrid =
            document.getElementById(
                "plotGrid"
            );


        const loading =
            document.getElementById(
                "loading"
            );


        const saveBar =
            document.getElementById(
                "saveBar"
            );


        const saveAllBtn =
            document.getElementById(
                "saveAllBtn"
            );


        const message =
            document.getElementById(
                "message"
            );



        /* =====================================
           STORE ORIGINAL STATUS

           This lets us save only changed plots.
        ====================================== */

        let originalStatuses =
            {};



        /* =====================================
           MESSAGE
        ====================================== */

        function showMessage(text) {

            message.textContent =
                text;


            message.style.display =
                "block";


            setTimeout(
                function () {

                    message.style.display =
                        "none";

                },
                3000
            );

        }



        /* =====================================
           SHOW ALL PROJECTS
        ====================================== */

        function showProjects() {

            projectsPage.style.display =
                "block";


            keladGreensPage.style.display =
                "none";


            backBtn.style.display =
                "none";


            saveBar.style.display =
                "none";


            navbarTitle.textContent =
                "All Projects";


            window.scrollTo(
                0,
                0
            );

        }



        /* =====================================
           SHOW KELAD GREENS
        ====================================== */

        async function showKeladGreens() {

            projectsPage.style.display =
                "none";


            keladGreensPage.style.display =
                "block";


            backBtn.style.display =
                "inline-flex";


            saveBar.style.display =
                "block";


            navbarTitle.textContent =
                "Kelad Greens";


            window.scrollTo(
                0,
                0
            );


            await loadPlots();

        }



        /* =====================================
           PROJECT CLICK
        ====================================== */

        document
            .querySelectorAll(
                ".project-card"
            )
            .forEach(
                function (card) {

                    card.addEventListener(
                        "click",
                        function () {

                            const project =
                                this.dataset.project;


                            if (
                                project ===
                                "kelad-greens"
                            ) {

                                showKeladGreens();

                            }

                            else {

                                showMessage(
                                    "This project will be available soon."
                                );

                            }

                        }
                    );

                }
            );



        /* =====================================
           BACK TO PROJECTS
        ====================================== */

        backBtn.addEventListener(
            "click",
            function () {

                showProjects();

            }
        );



        /* =====================================
           LOAD KELAD GREENS PLOTS
        ====================================== */

        async function loadPlots() {


            plotGrid.innerHTML =
                "";


            originalStatuses =
                {};


            loading.style.display =
                "block";


            const {
                data,
                error
            }
                =
                await supabase

                    .from(
                        "kelad_greens_plots"
                    )

                    .select(
                        "*"
                    )

                    .order(
                        "plot_number",
                        {
                            ascending: true
                        }
                    );


            loading.style.display =
                "none";


            if (error) {

                console.error(
                    error
                );


                plotGrid.innerHTML =
                    "<p>Error loading plots.</p>";


                return;

            }


            if (
                !data ||
                data.length === 0
            ) {

                plotGrid.innerHTML =
                    "<p>No plots found.</p>";


                return;

            }


            data.forEach(
                function (plot) {


                    originalStatuses[
                        plot.id
                    ]
                        =
                        plot.status;


                    const card =
                        document.createElement(
                            "div"
                        );


                    card.className =
                        "plot-card";


                    card.innerHTML =
                        `

                        <div class="plot-card-top">

                            <div class="plot-number">

                                ${plot.plot_number}

                            </div>

                        </div>


                        <div class="plot-details">

                            <h3>

                                ${plot.plot_size}

                            </h3>


                            <p>

                                Road:
                                ${plot.road}

                            </p>

                        </div>


                        <select
                            id="status-${plot.id}"
                            data-id="${plot.id}"
                        >

                            <option
                                value="available"
                                ${plot.status === "available"
                            ? "selected"
                            : ""
                        }
                            >

                                Available

                            </option>


                            <option
                                value="booked"
                                ${plot.status === "booked"
                            ? "selected"
                            : ""
                        }
                            >

                                Booked

                            </option>


                            <option
                                value="soldout"
                                ${plot.status === "soldout"
                            ? "selected"
                            : ""
                        }
                            >

                                Sold Out

                            </option>

                        </select>

                    `;


                    plotGrid.appendChild(
                        card
                    );

                }
            );

        }



        /* =====================================
           SAVE ALL CHANGES
        ====================================== */

        saveAllBtn.addEventListener(
            "click",
            async function () {


                const selects =
                    document.querySelectorAll(
                        "#plotGrid select"
                    );


                const changes =
                    [];


                selects.forEach(
                    function (select) {


                        const id =
                            select.dataset.id;


                        const newStatus =
                            select.value;


                        if (
                            originalStatuses[id]
                            !==
                            newStatus
                        ) {

                            changes.push({
                                id: id,
                                status: newStatus
                            });

                        }

                    }
                );


                if (
                    changes.length === 0
                ) {

                    showMessage(
                        "No changes to save."
                    );


                    return;

                }


                saveAllBtn.disabled =
                    true;


                saveAllBtn.textContent =
                    "Saving...";


                let hasError =
                    false;


                for (
                    const change
                    of
                    changes
                ) {


                    const {
                        error
                    }
                        =
                        await supabase

                            .from(
                                "kelad_greens_plots"
                            )

                            .update({
                                status:
                                    change.status
                            })

                            .eq(
                                "id",
                                change.id
                            );


                    if (
                        error
                    ) {

                        console.error(
                            error
                        );


                        hasError =
                            true;

                    }

                }


                saveAllBtn.disabled =
                    false;


                saveAllBtn.textContent =
                    "Save All Changes";


                if (
                    hasError
                ) {

                    showMessage(
                        "Some changes could not be saved."
                    );


                    return;

                }


                changes.forEach(
                    function (change) {

                        originalStatuses[
                            change.id
                        ]
                            =
                            change.status;

                    }
                );


                showMessage(
                    "All changes saved successfully!"
                );

            }
        );



        /* =====================================
    LOGIN
 ===================================== */

        loginForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                const loginValue =
                    document.getElementById(
                        "loginInput"
                    ).value
                        .trim()
                        .toLowerCase();


                const password =
                    document.getElementById(
                        "password"
                    ).value;


                /* =====================================
                   USERNAME → EMAIL MAP
                ====================================== */

                const usernameMap = {

                    lokdham: "lokdhamdevelopers@gmail.com",
                    rgdev: "ronitgodambe@gmail.com"

                };


                let email;


                /* If user entered an email */
                if (
                    loginValue.includes("@")
                ) {

                    email = loginValue;

                }

                /* If user entered a username */
                else {

                    email =
                        usernameMap[loginValue];

                }


                /* Invalid username */

                if (!email) {

                    loginMessage.textContent =
                        "Invalid username or email.";

                    return;

                }


                loginMessage.textContent =
                    "Logging in...";


                const {
                    error
                }
                    =
                    await supabase
                        .auth
                        .signInWithPassword({

                            email: email,

                            password: password

                        });


                if (
                    error
                ) {

                    console.error(
                        error
                    );


                    loginMessage.textContent =
                        "Invalid username, email or password.";

                    return;

                }


                loginMessage.textContent =
                    "";


                loginScreen.style.display =
                    "none";


                appScreen.style.display =
                    "block";


                showProjects();

            }
        );



        /* =====================================
           CHECK EXISTING SESSION
        ====================================== */

        async function checkLogin() {


            const {
                data:
                {
                    session
                }
            }
                =
                await supabase

                    .auth

                    .getSession();


            if (
                session
            ) {

                loginScreen.style.display =
                    "none";


                appScreen.style.display =
                    "block";


                showProjects();

            }

            else {

                loginScreen.style.display =
                    "flex";


                appScreen.style.display =
                    "none";

            }

        }



        /* =====================================
           LOGOUT
        ====================================== */

        logoutBtn.addEventListener(
            "click",
            async function () {


                logoutBtn.disabled =
                    true;


                logoutBtn.textContent =
                    "Logging out...";


                const {
                    error
                }
                    =
                    await supabase

                        .auth

                        .signOut();


                if (
                    error
                ) {

                    console.error(
                        error
                    );


                    showMessage(
                        "Error logging out."
                    );


                    logoutBtn.disabled =
                        false;


                    logoutBtn.textContent =
                        "Logout";


                    return;

                }


                plotGrid.innerHTML =
                    "";


                originalStatuses =
                    {};


                appScreen.style.display =
                    "none";


                saveBar.style.display =
                    "none";


                loginScreen.style.display =
                    "flex";


                loginForm.reset();


                loginMessage.textContent =
                    "";


                logoutBtn.disabled =
                    false;


                logoutBtn.textContent =
                    "Logout";

            }
        );



        /* =====================================
           START
        ====================================== */

        checkLogin();


    </script>
